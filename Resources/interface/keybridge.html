<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>KeyBridge</title><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
#keybridge-app{color-scheme:light dark;--kb-bg:#fff;--kb-chrome:#f4f4f5;--kb-text:#202124;--kb-secondary:#606169;--kb-line:#dedfe3;--kb-blue:#0861cf;--kb-blue-bg:#0967d8;--kb-blue-text:#fff;--kb-green:#267447;--kb-amber:#885406;--kb-red:#ae3436;--kb-hover:#ededf0;--kb-alert:#fbf5e9;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--kb-text);width:100%;min-width:760px;max-width:none;margin:0;padding:0;height:100vh}
#keybridge-app *{box-sizing:border-box}
#keybridge-app [hidden]{display:none!important}
#keybridge-app button,#keybridge-app input,#keybridge-app select{font:inherit;accent-color:var(--kb-blue-bg)}
#keybridge-app button{appearance:none;-webkit-appearance:none;margin:0;line-height:inherit;cursor:default;transition:background-color 120ms ease;border:1px solid var(--kb-line);border-radius:7px;padding:7px 13px;background:var(--kb-bg);color:var(--kb-text);white-space:nowrap}
#keybridge-app button:hover:not(:disabled):not([aria-disabled="true"]){background:var(--kb-hover)}
#keybridge-app button:active:not(:disabled):not([aria-disabled="true"]){transform:translateY(1px)}
#keybridge-app button:disabled,#keybridge-app button[aria-disabled="true"]{opacity:.46;cursor:not-allowed}
#keybridge-app button:focus-visible,#keybridge-app select:focus-visible,#keybridge-app summary:focus-visible,#keybridge-app input:focus-visible{outline:3px solid var(--kb-blue);outline-offset:3px}
#keybridge-app .kb-primary{background:var(--kb-blue-bg);border-color:transparent;color:var(--kb-blue-text);font-weight:600}
#keybridge-app .kb-primary:hover:not(:disabled):not([aria-disabled="true"]){background:color-mix(in srgb,var(--kb-blue-bg),var(--kb-text) 12%)}
#keybridge-app .kb-quiet{border:0;background:transparent;color:var(--kb-secondary);padding:5px 8px}
#keybridge-app .kb-link{border:0;background:transparent;color:var(--kb-blue);padding:0;text-align:left}
#keybridge-app select{color:var(--kb-text);background:var(--kb-bg);border:1px solid var(--kb-line);padding:7px 8px;border-radius:6px;max-width:100%}
#keybridge-app .kb-window{background:var(--kb-bg);border-radius:12px;box-shadow:0 6px 24px #1517251a;overflow:visible}
#keybridge-app .kb-titlebar{display:flex;justify-content:space-between;align-items:center;padding:15px 22px 8px;background:var(--kb-chrome);border-radius:12px 12px 0 0}
#keybridge-app .kb-brand{display:flex;align-items:center;gap:9px}
#keybridge-app .kb-brand i,#keybridge-app .kb-brand svg{width:18px;height:18px;color:var(--kb-blue)}
#keybridge-app .kb-brand strong{font-weight:600;letter-spacing:-.01em}
#keybridge-app .kb-tabs{display:flex;gap:22px;padding:0 28px;background:var(--kb-chrome);border-bottom:1px solid var(--kb-line)}
#keybridge-app .kb-tabs button{border:0;border-radius:0;padding:12px 0 10px;background:transparent;color:var(--kb-secondary);border-bottom:2px solid transparent}
#keybridge-app .kb-tabs button[aria-current="page"]{color:var(--kb-text);border-bottom-color:var(--kb-blue);font-weight:600}
#keybridge-app .kb-content{padding:24px;min-height:0}
#keybridge-app .kb-content h2{font-size:23px;line-height:1.2;letter-spacing:-.025em;font-weight:600;margin:0 0 10px;text-wrap:balance}
#keybridge-app .kb-content h3{font-size:15px;line-height:1.35;font-weight:600;margin:0 0 5px}
#keybridge-app p{margin:0;color:var(--kb-secondary);max-width:64ch;overflow-wrap:anywhere}
#keybridge-app .kb-lead{margin-bottom:20px}
#keybridge-app .kb-state-title{display:flex;align-items:center;gap:10px}
#keybridge-app .kb-dot{width:9px;height:9px;border-radius:50%;background:var(--kb-secondary);flex:none}
#keybridge-app .kb-dot.green{background:var(--kb-green)}
#keybridge-app .kb-dot.amber{background:var(--kb-amber)}
#keybridge-app .kb-dot.blue{background:var(--kb-blue)}
#keybridge-app .kb-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0;border-top:1px solid var(--kb-line)}
#keybridge-app .kb-row>div{min-width:0}
#keybridge-app .kb-row strong{font-weight:500;display:block;overflow-wrap:anywhere}
#keybridge-app .kb-row small,#keybridge-app small{font-size:12px;color:var(--kb-secondary)}
#keybridge-app .kb-download{display:inline-block;color:var(--kb-blue);font-size:13px;margin-top:8px;margin-bottom:4px;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
#keybridge-app a:focus-visible{outline:3px solid var(--kb-blue);outline-offset:3px}
#keybridge-app .kb-row small{display:block;overflow-wrap:anywhere}
#keybridge-app .kb-row .kb-value{text-align:right;color:var(--kb-secondary);font-size:13px;flex-shrink:0}
#keybridge-app .kb-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
#keybridge-app .kb-explain{font-size:12px;margin-top:10px}
#keybridge-app .kb-status-line{font-size:12px;color:var(--kb-secondary);margin:18px 0 0;display:flex;gap:18px;flex-wrap:wrap}
#keybridge-app .kb-issue .kb-lead p{min-height:63px;max-width:none}
#keybridge-app .kb-issue-remedy{min-height:63px;max-width:none}
#keybridge-app .kb-setting-explain{font-size:12px;min-height:36px;max-width:none}
#keybridge-app .kb-auto-row .kb-check small{min-height:36px}
#keybridge-app .kb-permission .kb-row{padding-bottom:6px}
#keybridge-app .kb-proof{padding:20px 0;border-top:1px solid var(--kb-line);border-bottom:1px solid var(--kb-line)}
#keybridge-app .kb-proof>div{display:grid;grid-template-columns:minmax(0,1fr) 168px;align-items:start;gap:24px}
#keybridge-app .kb-proof [data-action="probe"]{width:168px;height:36px;white-space:nowrap;justify-self:end}
#keybridge-app .kb-proof-control{display:flex;flex-direction:column;align-items:stretch;gap:8px}
#keybridge-app .kb-proof-control .kb-explain{margin:0;font-size:12px}
#keybridge-app .kb-manual-check{margin-top:18px;padding-top:16px;border-top:1px solid var(--kb-line)}
#keybridge-app .kb-help{margin:0;padding:0}
#keybridge-app .kb-setup-progress{margin-top:12px;font-size:12px}
#keybridge-app .kb-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#keybridge-app .kb-proof h3{font-size:16px}
#keybridge-app .kb-proof .kb-meta{margin-top:8px;font-size:12px}
#keybridge-app .kb-green{color:var(--kb-green)}
#keybridge-app .kb-amber{color:var(--kb-amber)}
#keybridge-app .kb-footer{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:12px;padding:8px 24px;border-top:1px solid var(--kb-line);background:var(--kb-chrome);border-radius:0 0 12px 12px}
#keybridge-app .kb-panel-start{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:174px}
#keybridge-app .kb-panel-start>span{font-size:12px;color:var(--kb-secondary);white-space:nowrap}
#keybridge-app .kb-panel-controls{display:flex;gap:8px;align-items:center}
#keybridge-app #kb-back:empty{display:none}
#keybridge-app .kb-more{position:relative}
#keybridge-app .kb-more summary{display:flex;align-items:center;padding:8px;list-style:none;border-radius:5px}
#keybridge-app summary::-webkit-details-marker{display:none}
#keybridge-app .kb-more summary svg{width:18px;height:18px}
#keybridge-app .kb-more[open]>div{position:absolute;bottom:42px;left:0;padding:5px;min-width:205px;background:var(--kb-bg);box-shadow:0 5px 24px #00000028;border-radius:8px;z-index:4}
#keybridge-app .kb-more button{border:0;width:100%;text-align:left}
#keybridge-app .kb-steps{list-style:none;padding:0;margin:24px 0;display:grid;gap:14px}
#keybridge-app .kb-steps li{display:flex;gap:10px;align-items:center;color:var(--kb-secondary)}
#keybridge-app .kb-steps li::before{content:"";width:8px;height:8px;border:1px solid var(--kb-line);border-radius:50%;flex:none}
#keybridge-app .kb-steps li.done::before{background:var(--kb-green);border-color:var(--kb-green)}
#keybridge-app .kb-steps li.current{color:var(--kb-text);font-weight:500}
#keybridge-app .kb-steps li.current::before{background:var(--kb-blue);border-color:var(--kb-blue)}
#keybridge-app .kb-check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
#keybridge-app .kb-check input{margin-top:4px;width:16px;height:16px;flex:none}
#keybridge-app .kb-check small{font-weight:400;display:block;margin-top:4px}
#keybridge-app .kb-auto-row{align-items:flex-start}
#keybridge-app .kb-auto-feedback{flex:none;min-width:9ch;padding-top:2px;font-size:12px;color:var(--kb-secondary);text-align:right}
#keybridge-app .kb-auto-feedback[data-saved="false"]{visibility:hidden}
#keybridge-app .kb-details{margin-top:20px}
#keybridge-app .kb-installation{border-top:1px solid var(--kb-line);padding-top:18px;margin-top:24px}
#keybridge-app .kb-installation-body{padding-top:14px}
#keybridge-app .kb-company{display:grid;grid-template-columns:186px minmax(0,1fr);align-items:start;gap:18px;margin-top:24px;padding:16px 18px;background:#1b2a44;border-radius:10px;text-decoration:none;color:#d7dee8;cursor:pointer}
#keybridge-app .kb-company img{display:block;width:186px;height:33px}
#keybridge-app .kb-company-copy{min-width:0;font-size:12.5px;line-height:1.5}
#keybridge-app .kb-company-description{display:block}
#keybridge-app .kb-company-link{display:block;margin-top:9px;color:#7fb0ff;font-weight:600;white-space:nowrap}
#keybridge-app .kb-company:hover .kb-company-link{text-decoration:underline;text-underline-offset:3px}
#keybridge-app .kb-company:focus-visible{outline:3px solid var(--kb-blue);outline-offset:-3px}
#keybridge-app .kb-details summary{color:var(--kb-blue)}
#keybridge-app .kb-details p{font-size:12px;padding-top:8px}
#keybridge-app .kb-resource-list{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:baseline;gap:8px 24px}
#keybridge-app dt,#keybridge-app dd{margin:0}
#keybridge-app dd{text-align:right;font-variant-numeric:tabular-nums}
#keybridge-app .kb-proof .kb-actions{gap:8px}
@media(prefers-reduced-motion:reduce){#keybridge-app button{transition:none}#keybridge-app button:active:not(:disabled):not([aria-disabled="true"]){transform:none}}

#keybridge-app .kb-window{height:100vh;min-height:560px;min-width:760px;display:flex;flex-direction:column;overflow:hidden}
#keybridge-app .kb-titlebar,#keybridge-app .kb-tabs{flex-shrink:0}
#keybridge-app .kb-dock{display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;min-width:0;flex-wrap:nowrap}
#keybridge-app .kb-dock-secondary{display:flex;align-items:flex-start;gap:8px;flex:0 0 auto;flex-wrap:nowrap}
#keybridge-app .kb-dock-secondary:empty,#keybridge-app .kb-dock-primary:empty{display:none}
#keybridge-app .kb-footer button{min-height:36px;min-width:max-content;max-width:100%;flex-shrink:0}
#keybridge-app .kb-dock-primary{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:300px;text-align:right;flex:0 0 auto}
#keybridge-app .kb-dock-primary:has([data-action="probe"]){width:168px;max-width:168px}
#keybridge-app .kb-dock-primary .kb-explain{font-size:12px;margin:0;max-width:none;white-space:nowrap}
#keybridge-app .kb-dock-primary [data-action="probe"]{width:168px;height:36px;min-height:36px;white-space:nowrap}
#keybridge-app .kb-footer{flex:0 0 100px;min-height:100px}
#keybridge-app .kb-page-link{display:block;text-align:left;margin:18px 0 0;padding:4px 0;border:0;background:transparent;color:var(--kb-blue);text-decoration:underline;text-underline-offset:3px}
#keybridge-app .kb-proof>div{display:block}
#keybridge-app .kb-content:focus-within{scroll-behavior:auto}
#keybridge-app .kb-guide{margin:18px 0;padding-left:22px;color:var(--kb-text);max-width:65ch}
#keybridge-app .kb-guide li+li{margin-top:14px}
#keybridge-app .kb-help-section{margin-top:22px}
#keybridge-app .kb-file-choice{margin-top:18px;border-top:1px solid var(--kb-line);padding-top:14px}
#keybridge-app .kb-file-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
#keybridge-app .kb-file-heading strong{font-weight:500}
#keybridge-app .kb-file-heading .kb-download{margin:0;flex:none}
#keybridge-app .kb-file-instruction{margin-top:10px;font-size:13px;max-width:none}
#keybridge-app .kb-file-row{border:0;padding:10px 0 0}
#keybridge-app .kb-file-row button{flex:none;min-width:110px}
#keybridge-app .kb-content{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;overscroll-behavior:contain}
#keybridge-app .kb-file-row small:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#keybridge-app .kb-window{border-radius:0;box-shadow:none}
#keybridge-app .kb-titlebar,#keybridge-app .kb-footer{border-radius:0}
#keybridge-app .kb-resource-list dt,#keybridge-app .kb-resource-list dd{white-space:nowrap}
@media(prefers-color-scheme:dark){#keybridge-app{--kb-bg:#202124;--kb-chrome:#292a2d;--kb-text:#f0f0f1;--kb-secondary:#b9bac2;--kb-line:#45464d;--kb-blue:#86baff;--kb-blue-bg:#3176d3;--kb-green:#8cd5aa;--kb-amber:#efbd73;--kb-red:#f3a4a8;--kb-hover:#35363c;--kb-alert:#342f25;}}</style></head><body><div id="keybridge-app">  <section class="kb-window" aria-label="Окно KeyBridge">
    <header class="kb-titlebar"><div class="kb-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.5" cy="8.5" r="5.5"/><path d="m11.6 12.4-8.1 8.1H1.5v-3l2-2h2v-2h2l2-2"/><circle cx="16" cy="8" r=".6" fill="currentColor" stroke="none"/></svg><strong>KeyBridge</strong></div><button class="kb-quiet" data-action="hide">Скрыть окно</button></header>
    <nav class="kb-tabs" aria-label="Разделы приложения"><button data-tab="main" aria-current="page">Ключ</button><button data-tab="settings">Настройки</button></nav>
    <div class="kb-content" id="kb-content" role="region" aria-label="Содержимое текущего экрана"></div>
    <footer class="kb-footer" aria-label="Действия KeyBridge"><div class="kb-panel-start"><div class="kb-panel-controls"><div id="kb-back"></div><button id="kb-stop" class="kb-secondary" data-action="stop" aria-describedby="kb-footnote">Выключить</button><details class="kb-more"><summary id="kb-more-toggle" aria-label="Другие действия"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></summary><div><button data-action="quit">Выключить и выйти</button></div></details></div><span id="kb-footnote"></span></div><div class="kb-dock" id="kb-dock" aria-label="Действия текущего экрана"></div></footer>
  </section>
<div class="kb-sr-only" role="status" aria-live="polite" aria-atomic="true" id="kb-announcement"></div></div><script src="keybridge.js"></script></body></html>
